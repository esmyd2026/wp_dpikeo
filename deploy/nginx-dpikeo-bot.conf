# Server block para el bot de WhatsApp de DPIKEOS.
# Convive con otros sitios (p.ej. arka01) en la misma VM: no comparte PHP-FPM
# (usa 8.5, no la versión de las otras apps), ni base de datos, ni .env.
#
# Instalación:
#   sudo cp deploy/nginx-dpikeo-bot.conf /etc/nginx/sites-available/dpikeo-bot.conf
#   sudo ln -s /etc/nginx/sites-available/dpikeo-bot.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dpikeo.tudominio.com
#
# Reemplaza "dpikeo.tudominio.com" y la ruta /var/www/dpikeo-bot por los reales.

server {
    listen 80;
    listen [::]:80;
    server_name dpikeo.tudominio.com;

    root /var/www/dpikeo-bot/public;
    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Fotos de productos/categorías y demás archivos públicos servidos vía
    # el enlace simbólico de storage:link.
    location /storage/ {
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloquea todo lo que empiece por punto, salvo /.well-known (Certbot).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/dpikeo-bot-access.log;
    error_log /var/log/nginx/dpikeo-bot-error.log;
}
